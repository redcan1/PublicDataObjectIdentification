[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerialdetect"
version = "0.1.0"
description = "Fine-tune YOLO on public aerial datasets, run it over any georeferenced imagery (NAIP, drone orthomosaics), and turn detections into GIS features for analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyogrio>=0.7",
    "pyproj>=3.6",
    "rasterio>=1.3.9",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
ml = ["ultralytics>=8.3"]                                   # YOLO training + inference (pulls torch, opencv)
naip = ["pystac-client>=0.7", "planetary-computer>=1.0"]    # NAIP from Microsoft Planetary Computer
osm = ["osmnx>=2.0"]                                        # parking-lot polygons from OpenStreetMap
all = ["aerialdetect[ml,naip,osm]"]
dev = ["pytest>=8", "opencv-python-headless>=4.8"]

[project.scripts]
aerialdetect = "aerialdetect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
