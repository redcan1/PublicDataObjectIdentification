# End-to-end run on NAIP:  aerialdetect run configs/naip_example.yaml
#
# Example AOI: ~2 x 1.7 km around Arizona State University, Tempe AZ, which has lots of surface
# parking and mixed building density. Swap in any U.S. bbox, or set aoi.path to a polygon file.
aoi:
  bbox: [-111.945, 33.410, -111.925, 33.425]   # min_lon, min_lat, max_lon, max_lat

source:
  type: naip
  year: null            # null = most recent year that fully covers the AOI

model:
  weights: runs/xview_naip/weights/best.pt   # produced by the train step (see README)
  gsd: 0.3              # GSD of the training chips (prep-xview --chip-gsd)
  conf: 0.25
  device: null          # 0 = first GPU, "cpu" to force CPU

detect:
  tile_px: 640
  overlap_px: 128       # 128 px at 0.3 m = 38 m; should exceed the largest object you care about
  bands: [1, 2, 3]      # NAIP is R,G,B,NIR
  min_area_m2: {car: 4, building: 15}
  max_area_m2: {car: 30}

analysis:
  tracts:
    enabled: true
    year: 2023
    count_classes: [car, building]
    footprint_classes: [building]
  parking:
    enabled: true
    lots_path: null      # null = OpenStreetMap amenity=parking
    vehicle_classes: [car, truck_bus]
    m2_per_stall: 30

output:
  dir: outputs/tempe_naip
  gpkg: results.gpkg

cache_dir: data/cache
