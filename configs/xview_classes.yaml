# Collapse xView's 60 fine-grained classes into the few we analyse.
# Keys become YOLO class names (in this order); values are xView type_ids.
# Anything not listed is ignored (treated as background).
classes:
  car: [17, 18, 20, 21]                 # passenger vehicle, small car, pickup, utility truck
  truck_bus: [19, 23, 24, 25, 26, 27, 28, 29, 32, 60, 61]
  building: [71, 72, 73, 74, 76, 77]    # hut/tent, shed, building, hangar, damaged building, facility
  aircraft: [11, 12, 13, 15]            # fixed-wing, small aircraft, cargo plane, helicopter
  boat: [40, 41, 42, 44, 45, 47, 49, 50, 51, 52]
  storage_tank: [86]
